name: Crowdin Translations

on:
  push:
    branches:
      - dev
    paths:
      - "crowdin/en.json"
      - "crowdin.yaml"
      - ".github/workflows/crowdin.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if only action versions changed
        id: check_changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Get all files changed in this push.
          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")

          # If any file other than crowdin.yml changed, synchronization is required.
          OTHER_FILES=$(printf '%s\n' "$CHANGED_FILES" |
            grep -Fxv '.github/workflows/crowdin.yml' || true)

          if [ -n "$OTHER_FILES" ]; then
            echo "Crowdin-related files changed. Synchronization required."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only crowdin.yml changed. Check whether its changes are insignificant.
          CHANGES=$(git diff --unified=0 "$BEFORE" "$AFTER" -- .github/workflows/crowdin.yml)

          OTHER_CHANGES=$(printf '%s\n' "$CHANGES" |
            grep '^[+-]' |
            grep -vE '^[+-][[:space:]]*$' |
            grep -v '^+++' |
            grep -v '^---' |
            grep -vE '^[+-][[:space:]]*uses:[[:space:]]' |
            grep -vE '^[+-][[:space:]]*#' || true)

          if [ -z "$OTHER_CHANGES" ]; then
            echo "🛡️ Only action versions, comments, or blank lines changed in crowdin.yml. Skipping synchronization."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workflow configuration changed. Synchronization required."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize with Crowdin
        if: steps.check_changes.outputs.skip != 'true'
        uses: crowdin/github-action@5b9790df740c85af5412a3a3a91b24988d5d324f # v3.5.1
        with:
          config: crowdin.yaml

          upload_sources: true
          upload_translations: true
          download_translations: false

          localization_branch_name: l10n/crowdin

          create_pull_request: true
          pull_request_title: "Update Crowdin translations"
          pull_request_body: |
            Automated translation updates from Crowdin.

            Please review the updated translations before merging.
          pull_request_base_branch_name: dev

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
