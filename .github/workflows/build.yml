name: Build and Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release?"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  id-token: write # Required for OIDC identity token generation (Sigstore)
  attestations: write # Required for committing the generated attestations
  artifact-metadata: write # Required for creating GitHub's backend artifact storage record

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/lithium

      - name: Set up Environment & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y markdown
          chmod +x build.sh
          [ -f check-syntax.sh ] && chmod +x check-syntax.sh || true

      - name: Build Module Assets
        run: |
          ./build.sh

      - name: Parse Module Metadata
        id: metadata
        run: |
          VERSION=$(sed -n 's/^version=\([^ ]*\).*/\1/p' module.prop)
          VERSION_CODE=$(sed -n "s/^versionCode=//p" module.prop)
          ID=$(sed -n "s/^id=//p" module.prop)

          {
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "basename=${ID}-with-webui_${VERSION}_${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Version Match
        id: verify_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          else
            TARGET_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          MODULE_VERSION="${{ steps.metadata.outputs.version }}"

          echo "Target Tag:     $TARGET_TAG"
          echo "Module Version: $MODULE_VERSION"

          if [ "$TARGET_TAG" != "$MODULE_VERSION" ]; then
            echo "::error title=Version Mismatch::Tag version ($TARGET_TAG) does not match module version ($MODULE_VERSION)!"
            exit 1
          fi
          echo "✅ Versions match successfully!"

      - name: Commit & Push Updated Files
        id: create_commit
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: dev
          files: |
            .
            :(exclude)check-syntax.sh
          commit_message: "🤖 Automated version bump to ${{ steps.metadata.outputs.version }} [skip ci]"
          fail_on_self_push: false
          empty_commit: false

      - name: Fail if no changes were committed
        if: steps.create_commit.outputs.pushed == 'false'
        run: |
          echo "::error title=No changes committed::Working directory is clean. No changes found to commit."
          exit 1

      - name: Generate cryptographic attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            _builds/${{ steps.metadata.outputs.basename }}/*

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: Release ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.version_code }})
          body_path: install/latest-release-notes.md
          draft: false
          prerelease: false
          files: |
            _builds/${{ steps.metadata.outputs.basename }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
