version: 2
updates:
  # GitHub Actions → ci(deps)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    assignees:
      - "Infiniti151"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
    target-branch: "main"

  # App dependencies → chore(deps)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    assignees:
      - "Infiniti151"
    groups:
      app-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    target-branch: "main"