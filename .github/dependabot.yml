version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    assignees:
      - "Infiniti151"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    target-branch: "main"